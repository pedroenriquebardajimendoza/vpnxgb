<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VPNxGB{% endblock %} · Panel</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">VPN<span>x</span>GB</a>
  <nav>
    <a href="/">Inicio</a>
    <a href="/monitor">Monitor</a>
    <a href="/clients">Clientes</a>
    <a href="/plans">Planes</a>
    <a href="/sales">Ventas</a>
    <a href="/settings">Ajustes</a>
    <a href="/logout" class="muted">Salir</a>
  </nav>
</header>
{% endif %}
<main class="wrap">
  {% if flash %}
  <div class="flash {{ flash.kind }}">{{ flash.message }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
